<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V151 - Kiểm tra lưu riêng</title><style>body{font:17px system-ui;background:#f4f7f5;color:#17392d;padding:16px;max-width:650px;margin:auto}main{background:white;padding:18px;border-radius:16px}button{display:block;width:100%;padding:16px;margin:12px 0;border:0;border-radius:12px;background:#28674e;color:white;font-size:17px;font-weight:bold}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#5c6c64}</style><main><h2>🧪 V151 — Kiểm tra lưu riêng</h2><p>Chỉ dữ liệu giả, kho có tiền tố riêng. Không kết nối V150 hay Supabase.</p><button id="init">1. Phục hồi dữ liệu giả vào kho thử trống</button><button id="verify">2. Kiểm tra 5 sổ sau khi tải lại Safari</button><button id="failure">3. Mô phỏng gián đoạn ghi</button><pre id="result">Chưa kiểm tra.</pre><small>Không dùng để nhập dữ liệu thật. Không tự xóa dữ liệu thử. Nếu báo kho không trống, dừng và gửi ảnh.</small></main>
<script src="atomic-ledgers-v103.js"></script><script src="ledger-transaction-v115.js"></script><script src="ledger-staging-v116.js"></script><script src="ledger-audit-v117.js"></script><script src="mirror-restore-v125.js"></script><script src="workflow-v44.js"></script><script src="adjustments-v58.js"></script><script src="accounting-v60.js"></script><script src="independent-restore-v150.js"></script><script src="independent-export-v151.js"></script>
<script>
'use strict';const PREFIX='coloastay-v151-persistent-only-20261121:';const out=document.getElementById('result');function store(fail=()=>false){return {getItem:k=>localStorage.getItem(PREFIX+k),setItem:(k,v)=>{if(fail(k))throw Error('Gián đoạn mô phỏng');localStorage.setItem(PREFIX+k,String(v))},removeItem:k=>localStorage.removeItem(PREFIX+k)}}
async function pkg(){let r=await fetch('DU_LIEU_GIA_V151_DA_SUA_SO.json',{cache:'no-store'});if(!r.ok)throw Error('Không tải được JSON giả');return r.json()}
function show(t){out.textContent=t}async function run(fn){try{await fn()}catch(e){show('CHƯA ĐẠT: '+e.message)}}
document.getElementById('init').onclick=()=>run(async()=>{const p=await pkg(),R=CLSIndependentRestore150; if(!R.empty(store())){show('DỪNG: kho thử đã có dữ liệu. Không ghi đè. Bấm bước 2 để kiểm tra.');return}let x=R.restoreEmpty(store(),p,true);show('ĐÃ PHỤC HỒI KHO THỬ: '+x.bookings+' đơn. Bây giờ tải lại trang Safari rồi bấm bước 2.')});
document.getElementById('verify').onclick=()=>run(async()=>{const p=await pkg(),G=CLSLedger115,R=CLSIndependentRestore150,A=CLSAtomic101;const s=store(),d=G.readCommitted(s);if(!d){show('CHƯA ĐẠT: Không có bản xác nhận');return}const checks=G.KEYS.map((k,i)=>({name:['Sổ đặt phòng','Sổ duyệt V48','Sổ điều chỉnh V58','Sổ kế toán V60','Sổ phục hồi'][i],ok:d[k]===p.items[k]&&s.getItem(k)===p.items[k]}));let exported=R.prepare(CLSIndependentExport151.pack(s));const main=JSON.parse(d[G.KEYS[0]]);const max=Math.max(0,...main.bookings.map(b=>Number((/^DP-(\d+)$/.exec(b.code||'')||[])[1]||0)));show(checks.map(c=>(c.ok?'✓ ':'✗ ')+c.name).join('\n')+'\n'+(checks.every(c=>c.ok)?'5/5 sổ KHỚP':'CÓ SỔ KHÔNG KHỚP')+'\nXuất lại: '+exported.summary.bookings+' đơn\nMã tiếp theo (tính từ danh sách): DP-'+String(max+1).padStart(4,'0'))});
document.getElementById('failure').onclick=()=>run(async()=>{const p=await pkg(),A=CLSAtomic101,G=CLSLedger115,R=CLSIndependentRestore150;const s=store();const before=JSON.stringify(G.readCommitted(s));let refused=false;try{R.restoreEmpty(s,p,true)}catch(e){refused=true}const after=JSON.stringify(G.readCommitted(s));const m=new Map();const f={getItem:k=>m.has(k)?m.get(k):null,setItem:(k,v)=>{if(k===A.HEAD)throw Error('mô phỏng ngắt HEAD');m.set(k,String(v))},removeItem:k=>m.delete(k)};let failed=false;try{R.restoreEmpty(f,p,true)}catch(e){failed=true}show((refused&&before===after?'✓ Kho có dữ liệu được bảo toàn':'✗ Bảo toàn kho có dữ liệu')+'\n'+(failed&&G.readCommitted(f)===null?'✓ Gián đoạn trước xác nhận không tạo HEAD':'✗ Kiểm tra gián đoạn')+'\nĐây là mô phỏng lỗi ghi, không phải mất điện thật.')});
</script></html>
